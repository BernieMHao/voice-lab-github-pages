name: Deploy free browser TTS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm verify
      - name: Choose project or account Pages path
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER_NAME: ${{ github.repository_owner }}
        run: |
          if [ "$REPO_NAME" = "$OWNER_NAME.github.io" ]; then
            echo 'PAGES_BASE=/' >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE=/$REPO_NAME/" >> "$GITHUB_ENV"
          fi
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
